# Lint, get.sh checks and the fake-cluster end-to-end tests (tests/run.sh).
name: test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age ssss shellcheck bubblewrap libjson-perl

      - name: Run tests
        run: sudo bash tests/run.sh
